<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entry Cleanup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="cs-header">
    <a class="logo" href="/">
      <span class="logo-mark"><i data-icon="layers"></i></span>
      <span class="logo-text"><b>Stack Toolkit</b><small>for Contentstack</small></span>
    </a>
    <nav class="cs-nav">
      <a href="/migrations"><i data-icon="box"></i>Schema Migration</a>
      <a href="/entry-migration"><i data-icon="files"></i>Entry Migration</a>
      <a href="/entries" class="active"><i data-icon="list"></i>Entry Cleanup</a>
      <a href="/assets"><i data-icon="images"></i>Asset Cleanup</a>
      <a href="/broken-refs"><i data-icon="unlink"></i>Broken References</a>
    </nav>
    <nav class="cs-nav end">
      <a href="/changelog" class="version-badge" data-app-version title="What's new">v</a>
      <a href="/stacks"><i data-icon="key-round"></i>Stacks</a>
    </nav>
  </header>
  <a class="cs-sub" id="stacks" href="/stacks" title="Manage stack connections"></a>

  <div class="cs-shell">
    <aside class="cs-views">
      <div class="segmented">
        <button data-stack="source">Source</button>
        <button data-stack="target">Target</button>
      </div>
      <div class="search small">
        <i data-icon="search"></i>
        <input id="ctSearch" type="search" placeholder="Search content types">
      </div>
      <div class="views-group"><h3>Content types</h3><div id="ctPanel"></div></div>
      <select id="stack" hidden>
        <option value="source">Source</option>
        <option value="target">Target</option>
      </select>
      <select id="ct" hidden><option value="">— select —</option></select>
    </aside>

    <div class="cs-main">
      <div class="page-head">
        <h1>Entry Cleanup <span class="help" title="Bulk-delete entries of a content type – no 10-entry selection limit."><i data-icon="circle-help"></i></span></h1>
        <button class="btn" id="restoreBtn"><i data-icon="upload"></i>Restore backup</button>
        <input type="file" id="restoreFile" accept=".json,application/json" hidden>
      </div>

      <div class="toolbar">
        <div class="input-group">
          <select id="locale" style="width: 240px"><option value="">All languages</option></select>
          <input id="query" placeholder='Query JSON, e.g. {"title":{"$regex":"^Sok"}}' style="width: 360px">
          <button class="btn primary" id="load"><i data-icon="search"></i>Search</button>
        </div>
      </div>

      <div id="banner"></div>
      <main id="content"><p class="empty">Pick a content type on the left.</p></main>
    </div>
  </div>

  <footer class="bar">
    <span id="selCount"></span>
    <span class="spacer"></span>
    <button class="btn danger" id="deleteBtn" disabled><i data-icon="trash-2"></i>Delete selected</button>
  </footer>

  <dialog id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close"><i data-icon="x"></i></button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </dialog>

  <script src="/icons.js"></script>
  <script src="/shell.js"></script>
  <script src="/ui.js"></script>
  <script src="/entries.js"></script>
</body>
</html>
