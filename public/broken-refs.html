<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Broken References</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="cs-header">
    <a class="logo" href="/">
      <span class="logo-mark"><i data-icon="layers"></i></span>
      <span class="logo-text"><b>Stack Toolkit</b><small>for Contentstack</small></span>
    </a>
    <nav class="cs-nav">
      <a href="/migrations"><i data-icon="box"></i>Schema Migration</a>
      <a href="/entry-migration"><i data-icon="files"></i>Entry Migration</a>
      <a href="/entries"><i data-icon="list"></i>Entry Cleanup</a>
      <a href="/assets"><i data-icon="images"></i>Asset Cleanup</a>
      <a href="/broken-refs" class="active"><i data-icon="unlink"></i>Broken References</a>
      <a href="/lorem"><i data-icon="pilcrow"></i>Lorem Ipsum</a>
    </nav>
    <nav class="cs-nav end">
      <a href="/changelog" class="version-badge" data-app-version title="What's new">v</a>
      <a href="/stacks"><i data-icon="key-round"></i>Stacks</a>
    </nav>
  </header>
  <a class="cs-sub" id="stacks" href="/stacks" title="Manage stack connections"></a>

  <div class="cs-shell">
    <aside class="cs-views">
      <div class="segmented">
        <button data-stack="source">Source</button>
        <button data-stack="target">Target</button>
      </div>
      <div id="views"></div>
    </aside>

    <div class="cs-main">
      <div class="page-head">
        <h1>Broken References <span class="help" title="Finds entries that point at entries, content types or assets that no longer exist – in every locale."><i data-icon="circle-help"></i></span></h1>
        <div class="head-actions">
          <span class="none" id="scannedAt"></span>
          <button class="btn primary" id="scanBtn"><i data-icon="scan-search"></i>Scan stack</button>
        </div>
      </div>

      <div class="toolbar">
        <div class="search">
          <i data-icon="search"></i>
          <input id="search" type="search" placeholder="Search by entry, field or UID">
        </div>
      </div>

      <div id="banner"></div>
      <main id="content"><p class="empty">Loading…</p></main>
    </div>
  </div>

  <footer class="bar">
    <span id="selCount"></span>
    <span class="spacer"></span>
    <button class="btn danger" id="fixBtn" disabled><i data-icon="unlink"></i>Remove broken references</button>
  </footer>

  <dialog id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close"><i data-icon="x"></i></button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </dialog>

  <script src="/icons.js"></script>
  <script src="/shell.js"></script>
  <script src="/ui.js"></script>
  <script src="/broken-refs.js"></script>
</body>
</html>
