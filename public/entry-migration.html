<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entry Migration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="cs-header">
    <a class="logo" href="/">
      <span class="logo-mark"><i data-icon="layers"></i></span>
      <span class="logo-text"><b>Stack Toolkit</b><small>for Contentstack</small></span>
    </a>
    <nav class="cs-nav">
      <a href="/migrations"><i data-icon="box"></i>Schema Migration</a>
      <a href="/entry-migration" class="active"><i data-icon="files"></i>Entry Migration</a>
      <a href="/entries"><i data-icon="list"></i>Entry Cleanup</a>
      <a href="/assets"><i data-icon="images"></i>Asset Cleanup</a>
      <a href="/broken-refs"><i data-icon="unlink"></i>Broken References</a>
      <a href="/lorem"><i data-icon="pilcrow"></i>Lorem Ipsum</a>
    </nav>
    <nav class="cs-nav end">
      <a href="/changelog" class="version-badge" data-app-version title="What's new">v</a>
      <a href="/stacks"><i data-icon="key-round"></i>Stacks</a>
    </nav>
  </header>
  <a class="cs-sub" id="stacks" href="/stacks" title="Manage stack connections"></a>

  <div class="cs-shell">
    <aside class="cs-views">
      <div class="search small">
        <i data-icon="search"></i>
        <input id="ctSearch" type="search" placeholder="Search content types">
      </div>
      <div class="views-group"><h3>Content types</h3><div id="ctPanel"><p class="none">Loading…</p></div></div>
    </aside>

    <div class="cs-main">
      <div class="page-head">
        <h1>Entry Migration <span class="help" title="Copy entries – with their languages, referenced entries and assets – from the source to the target stack."><i data-icon="circle-help"></i></span></h1>
      </div>

      <div class="toolbar" id="options">
        <label class="field">Match entries by
          <select id="matchField"><option value="title">Title</option></select>
        </label>
        <label class="field">Existing in target
          <select id="existing">
            <option value="skip">Skip – keep target as is</option>
            <option value="update">Update – overwrite with source</option>
          </select>
        </label>
        <label class="field check-inline"><span>References</span>
          <span class="check-row"><input type="checkbox" id="includeRefs" checked> Include referenced entries</span>
        </label>
        <span class="spacer"></span>
        <div class="search">
          <i data-icon="search"></i>
          <input id="search" type="search" placeholder="Filter entries">
        </div>
      </div>

      <div id="banner"></div>
      <main id="content"><p class="empty">Pick a content type on the left.</p></main>
    </div>
  </div>

  <footer class="bar">
    <span id="selCount"></span>
    <span class="spacer"></span>
    <button class="btn primary" id="planBtn" disabled><i data-icon="files"></i>Preview migration</button>
  </footer>

  <dialog id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" data-close aria-label="Close"><i data-icon="x"></i></button>
    </div>
    <div id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </dialog>

  <script src="/icons.js"></script>
  <script src="/shell.js"></script>
  <script src="/ui.js"></script>
  <script src="/entry-migration.js"></script>
</body>
</html>
